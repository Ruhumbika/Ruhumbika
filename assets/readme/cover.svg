      <circle class="beacon" style="animation-delay:-1.78s" cx="740" cy="239" r="3" fill="currentColor"/>
      <text x="751" y="242" class="sans" fill="#f1f7fb" font-size="14" font-weight="700">Abood Media Radio</text>
