<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title description">
  <title id="title">Ruhumbika Mtumba John — Software Engineer</title>
  <desc id="description">A signal pulses through an original circuit board illustration. Three routes represent WhatsApp approvals, attendance events and radio automation.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0b1720"/>
      <stop offset="1" stop-color="#101b29"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#1c6863" stop-opacity=".8"/>
      <stop offset="1" stop-color="#1c6863" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0v24" fill="none" stroke="#81a6bb" stroke-opacity=".14"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="430" rx="19"/></clipPath>
    <path id="route-approval" pathLength="100" d="M600 215h31q14 0 14-14v-77q0-14 14-14h66"/>
    <path id="route-attendance" pathLength="100" d="M600 215h125"/>
    <path id="route-radio" pathLength="100" d="M600 215h31q14 0 14 14v77q0 14 14 14h66"/>
  </defs>
  <style>
    .mono { font-family: ui-monospace, Consolas, monospace; }
    .sans { font-family: system-ui, sans-serif; }
    .line { fill: none; stroke: currentColor; }
    .signal { stroke-width: 4; stroke-linecap: round; stroke-dasharray: 1 99; animation: signal 4.1s linear infinite; }
    .echo { stroke-width: 2; stroke-dasharray: 8 92; opacity: .55; animation: signal 4.1s linear infinite; }
    .pulse { transform-origin: 562px 215px; animation: pulse 4.1s ease-out infinite; }
    .beacon { animation: beacon 4.1s ease-in-out infinite; }
    .wave { transform-box: fill-box; transform-origin: center; animation: wave 1.35s ease-in-out infinite alternate; }
    .hop2 { animation-delay: -.8s; }
    .hop3 { animation-delay: -1.6s; }
    @keyframes signal { to { stroke-dashoffset: -100; } }
    @keyframes pulse { from { transform: scale(.75); opacity: .8; } to { transform: scale(1.52); opacity: 0; } }
    @keyframes beacon { 0%, 50%, 100% { opacity: .45; } 65%, 78% { opacity: 1; } }
    @keyframes wave { from { transform: scaleY(.28); } to { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) {
      .signal, .echo, .pulse, .beacon, .wave { animation: none; }
      .signal, .echo, .pulse { opacity: 0; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1000" height="430" fill="url(#background)"/>
    <rect x="480" width="520" height="430" fill="url(#grid)"/>
    <ellipse cx="595" cy="215" rx="231" ry="219" fill="url(#halo)" opacity=".53"/>
    <path d="M480 0v430M0 382h1000" fill="none" stroke="#345064"/>
    <path d="M45 58h25" stroke="#70efd2" stroke-width="3" stroke-linecap="round"/>
    <text x="83" y="63" class="mono" font-size="15" font-weight="700" letter-spacing="2" fill="#83e9d3">SOFTWARE ENGINEER</text>
    <g class="sans" fill="#f4fafb" font-size="55" font-weight="750" letter-spacing="-1.8">
      <text x="43" y="157">Ruhumbika</text>
      <text x="43" y="219">Mtumba John</text>
    </g>
    <g class="sans" fill="#c5d5e0" font-size="19">
      <text x="46" y="273">Business systems, APIs</text>
      <text x="46" y="301">and workflow automation.</text>
    </g>
    <text x="46" y="408" class="mono" font-size="13" letter-spacing="1" fill="#a8c2d0">TANZANIA  /  ABOOD GROUP  /  RJAY DIGITAL HUB</text>
    <text x="507" y="63" class="mono" font-size="13" letter-spacing="1.5" fill="#a8c2d0">SYSTEM INTEGRATIONS</text>
    <circle cx="562" cy="215" r="56" fill="none" stroke="#6dcbbd" opacity=".27" stroke-dasharray="3 7"/>
    <circle class="pulse" cx="562" cy="215" r="45" fill="none" stroke="#78efd0" stroke-width="1.5"/>
    <rect x="524" y="177" width="76" height="76" rx="18" fill="#102a34" stroke="#74ddc6"/>
    <path d="M534 215h12l6-12 9 27 11-32 8 17h10" fill="none" stroke="#9af9dc" stroke-width="2.3" stroke-linejoin="round"/>
    <g color="#70efd2">
      <use href="#route-approval" class="line" stroke-opacity=".37"/>
      <use href="#route-approval" class="line signal"/>
      <use href="#route-approval" class="line echo" style="animation-delay:-.2s"/>
      <rect x="725" y="78" width="236" height="64" rx="11" fill="#10252d" stroke="#3e736e"/>
      <circle class="beacon" cx="744" cy="99" r="4" fill="currentColor"/>
      <text x="757" y="104" class="sans" fill="#e9faf5" font-size="17" font-weight="700">ERP approvals</text>
      <text x="743" y="126" class="mono" fill="#b2cdd1" font-size="12">WhatsApp decisions</text>
    </g>
    <g color="#8ecbff">
      <use href="#route-attendance" class="line" stroke-opacity=".37"/>
      <use href="#route-attendance" class="line signal hop2"/>
      <use href="#route-attendance" class="line echo" style="animation-delay:-1s"/>
      <rect x="725" y="183" width="236" height="64" rx="11" fill="#132431" stroke="#4a6d8b"/>
      <circle class="beacon hop2" cx="744" cy="204" r="4" fill="currentColor"/>
      <text x="757" y="209" class="sans" fill="#e8f4ff" font-size="17" font-weight="700">Attendance events</text>
      <text x="743" y="231" class="mono" fill="#b2cdd1" font-size="12">Attendance to HR system</text>
    </g>
    <g color="#f6c582">
      <use href="#route-radio" class="line" stroke-opacity=".37"/>
      <use href="#route-radio" class="line signal hop3"/>
      <use href="#route-radio" class="line echo" style="animation-delay:-1.8s"/>
      <rect x="725" y="288" width="236" height="64" rx="11" fill="#25262b" stroke="#806b50"/>
      <circle class="beacon hop3" cx="744" cy="309" r="4" fill="currentColor"/>
      <text x="757" y="314" class="sans" fill="#fff5e7" font-size="17" font-weight="700">Radio automation</text>
      <text x="743" y="336" class="mono" fill="#decdbe" font-size="12">Scheduling to RadioBOSS</text>
      <path class="wave" d="M921 308v17" stroke="currentColor" stroke-width="2"/>
      <path class="wave hop2" d="M928 303v27" stroke="currentColor" stroke-width="2"/>
      <path class="wave hop3" d="M935 310v13" stroke="currentColor" stroke-width="2"/>
      <path class="wave" d="M942 306v21" stroke="currentColor" stroke-width="2" style="animation-delay:-.4s"/>
    </g>
  </g>
</svg>
