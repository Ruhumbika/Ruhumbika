    <text x="84" y="40" class="title" fill="#eef7fc">Cybersecurity</text>
    <text x="84" y="61" class="context" fill="#bad0dc">Secure configuration and defensive monitoring</text>
    <path d="M36 110h399" fill="none" stroke="#456070"/>
    <path class="signal" style="animation-delay:-1.84s" d="M36 110h399" pathLength="100" fill="none" stroke="currentColor"/>
    <circle class="pulse" style="animation-delay:-1.84s" cx="36" cy="110" r="8" fill="none" stroke="currentColor"/>
    <circle cx="36" cy="110" r="4" fill="#152632" stroke="currentColor" stroke-width="1.5"/>
    <text x="36" y="135" text-anchor="start" class="step" fill="#eef7fc">Harden</text>
    <circle class="pulse" style="animation-delay:-1.14s" cx="235.5" cy="110" r="8" fill="none" stroke="currentColor"/>
    <circle cx="235.5" cy="110" r="4" fill="#152632" stroke="currentColor" stroke-width="1.5"/>
    <text x="235.5" y="135" text-anchor="middle" class="step" fill="#eef7fc">Monitor</text>
    <circle class="pulse" style="animation-delay:-0.44s" cx="435" cy="110" r="8" fill="none" stroke="currentColor"/>
    <circle cx="435" cy="110" r="4" fill="#152632" stroke="currentColor" stroke-width="1.5"/>
    <text x="435" y="135" text-anchor="end" class="step" fill="#eef7fc">Triage</text>
  </g>
  <g transform="translate(509 194)" color="#a3c9ff">
    <rect width="473" height="160" rx="13" fill="#152632" stroke="#314757"/>
    <rect x="21" y="19" width="48" height="48" rx="11" fill="currentColor" fill-opacity=".12"/>
    <path d="M24 20v7m-11 4v-5h22v5M19 12h10v8H19zm-11 19h10v7H8zm22 0h10v7H30z" transform="translate(21 19)" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="40" class="title" fill="#eef7fc">Network Engineering</text>
    <text x="84" y="61" class="context" fill="#bad0dc">Network topology, segmentation and diagnostics</text>
    <path d="M36 110h399" fill="none" stroke="#456070"/>
    <path class="signal" style="animation-delay:-2.76s" d="M36 110h399" pathLength="100" fill="none" stroke="currentColor"/>
    <circle class="pulse" style="animation-delay:-2.76s" cx="36" cy="110" r="8" fill="none" stroke="currentColor"/>
    <circle cx="36" cy="110" r="4" fill="#152632" stroke="currentColor" stroke-width="1.5"/>
    <text x="36" y="135" text-anchor="start" class="step" fill="#eef7fc">Map</text>
    <circle class="pulse" style="animation-delay:-2.06s" cx="235.5" cy="110" r="8" fill="none" stroke="currentColor"/>
    <circle cx="235.5" cy="110" r="4" fill="#152632" stroke="currentColor" stroke-width="1.5"/>
    <text x="235.5" y="135" text-anchor="middle" class="step" fill="#eef7fc">Segment</text>
    <circle class="pulse" style="animation-delay:-1.36s" cx="435" cy="110" r="8" fill="none" stroke="currentColor"/>
    <circle cx="435" cy="110" r="4" fill="#152632" stroke="currentColor" stroke-width="1.5"/>
    <text x="435" y="135" text-anchor="end" class="step" fill="#eef7fc">Troubleshoot</text>
