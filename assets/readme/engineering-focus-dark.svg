<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" width="1000" height="372" role="img" aria-labelledby="focus-title focus-description">
  <title id="focus-title">Engineering focus</title>
  <desc id="focus-description">Four animated diagrams for API engineering, IT audit, defensive cybersecurity and network engineering.</desc>
  <style>
    .title { font: 700 22px system-ui, sans-serif; }
    .context { font: 15px system-ui, sans-serif; }
    .step { font: 600 14px ui-monospace, Consolas, monospace; }
    .signal { stroke-width: 3; stroke-linecap: round; stroke-dasharray: 10 90; animation: signal 4.3s linear infinite; }
    .pulse { opacity: 0; animation: pulse 4.3s ease-out infinite; }
    @keyframes signal { 0% { stroke-dashoffset: 10; opacity: 0; } 10%, 74% { opacity: .85; } 84%, 100% { stroke-dashoffset: -100; opacity: 0; } }
    @keyframes pulse { 0%, 36%, 100% { opacity: 0; } 10% { opacity: .65; } }
    @media (prefers-reduced-motion: reduce) { .signal, .pulse { animation: none; opacity: 0; } }
  </style>
  <rect x=".5" y=".5" width="999" height="371" rx="17" fill="#0f1a25" stroke="#314757"/>
  <g transform="translate(18 18)" color="#7ce8cf">
    <rect width="473" height="160" rx="13" fill="#152632" stroke="#314757"/>
    <rect x="21" y="19" width="48" height="48" rx="11" fill="currentColor" fill-opacity=".12"/>
    <path d="M15 18l-7 6 7 6m17-12 7 6-7 6m-10 4 5-20" transform="translate(21 19)" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="40" class="title" fill="#eef7fc">API Engineering</text>
    <text x="84" y="61" class="context" fill="#bad0dc">REST APIs, webhooks and background processing</text>
    <path d="M36 110h399" fill="none" stroke="#456070"/>
    <path class="signal" style="animation-delay:0.00s" d="M36 110h399" pathLength="100" fill="none" stroke="currentColor"/>
    <circle class="pulse" style="animation-delay:0.00s" cx="36" cy="110" r="8" fill="none" stroke="currentColor"/>
    <circle cx="36" cy="110" r="4" fill="#152632" stroke="currentColor" stroke-width="1.5"/>
    <text x="36" y="135" text-anchor="start" class="step" fill="#eef7fc">Validate</text>
    <circle class="pulse" style="animation-delay:0.70s" cx="235.5" cy="110" r="8" fill="none" stroke="currentColor"/>
    <circle cx="235.5" cy="110" r="4" fill="#152632" stroke="currentColor" stroke-width="1.5"/>
    <text x="235.5" y="135" text-anchor="middle" class="step" fill="#eef7fc">Queue</text>
    <circle class="pulse" style="animation-delay:1.40s" cx="435" cy="110" r="8" fill="none" stroke="currentColor"/>
    <circle cx="435" cy="110" r="4" fill="#152632" stroke="currentColor" stroke-width="1.5"/>
    <text x="435" y="135" text-anchor="end" class="step" fill="#eef7fc">Callback</text>
  </g>
  <g transform="translate(509 18)" color="#f8cd8b">
    <rect width="473" height="160" rx="13" fill="#152632" stroke="#314757"/>
    <rect x="21" y="19" width="48" height="48" rx="11" fill="currentColor" fill-opacity=".12"/>
    <path d="M15 13h16l5 5v17H15zM31 13v6h5m-16 4h10m-10 4h10m-10 4h6" transform="translate(21 19)" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="40" class="title" fill="#eef7fc">IT Audit</text>
    <text x="84" y="61" class="context" fill="#bad0dc">Access controls, change traceability and evidence</text>
    <path d="M36 110h399" fill="none" stroke="#456070"/>
    <path class="signal" style="animation-delay:-0.92s" d="M36 110h399" pathLength="100" fill="none" stroke="currentColor"/>
    <circle class="pulse" style="animation-delay:-0.92s" cx="36" cy="110" r="8" fill="none" stroke="currentColor"/>
    <circle cx="36" cy="110" r="4" fill="#152632" stroke="currentColor" stroke-width="1.5"/>
    <text x="36" y="135" text-anchor="start" class="step" fill="#eef7fc">Review</text>
    <circle class="pulse" style="animation-delay:-0.22s" cx="235.5" cy="110" r="8" fill="none" stroke="currentColor"/>
    <circle cx="235.5" cy="110" r="4" fill="#152632" stroke="currentColor" stroke-width="1.5"/>
    <text x="235.5" y="135" text-anchor="middle" class="step" fill="#eef7fc">Trace</text>
    <circle class="pulse" style="animation-delay:0.48s" cx="435" cy="110" r="8" fill="none" stroke="currentColor"/>
    <circle cx="435" cy="110" r="4" fill="#152632" stroke="currentColor" stroke-width="1.5"/>
    <text x="435" y="135" text-anchor="end" class="step" fill="#eef7fc">Document</text>
  </g>
  <g transform="translate(18 194)" color="#edabb0">
    <rect width="473" height="160" rx="13" fill="#152632" stroke="#314757"/>
    <rect x="21" y="19" width="48" height="48" rx="11" fill="currentColor" fill-opacity=".12"/>
